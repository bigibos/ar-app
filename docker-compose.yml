services:
  app:
    build: .
    restart: unless-stopped
    container_name: ar-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      SERVER_ALIAS: ${SERVER_ALIAS:-localhost}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BASE_URL: ${BASE_URL}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./:/var/www/html
      - ./docker/certs:/etc/apache2/ssl:ro
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: ar-app-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    container_name: ar-app-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
volumes:
  db_data:
    