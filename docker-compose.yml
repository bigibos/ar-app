services:
  app:
    build: .
    restart: unless-stopped
    container_name: ar-app
    ports:
      - "127.0.0.1:8080:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/certs:/etc/apache2/ssl:ro
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: ar-app-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    container_name: ar-app-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - mysql
volumes:
  db_data:
    